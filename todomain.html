<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2Do</title>
    <link rel="stylesheet" href="styleTodomain.css"> 
</head>
<body>
    <div class="container">
        <aside class="barra-lateral">
            <h2>2Do</h2>
        </aside>
        <main class="principal">
            <div id="enviar_tarefa" class="div_main">
                <p class="titulo">Adicionar tarefas</p>

                <form id="form-tarefa">
                    <label for="nome_tarefa">Nome:</label>
                        <input type="text" name="nome_tarefa" id="nome_tarefa" maxlength="60" placeholder="Corrida Matinal" required><br>
                    
                    <label>Importância:</label>
                        <input type="radio" id="alta" name="importancia" value="Alta" required>
                        <label for="alta">Alta</label>
                        <input type="radio" id="media" name="importancia" value="Média" required>
                        <label for="media">Média</label>
                        <input type="radio" id="baixa" name="importancia" value="Baixa" required>
                        <label for="baixa">Baixa</label><br>

                    <label for="desc">Descrição:</label><br>
                    <input type="text" id="desc" name="desc" placeholder="Correr 46 minutos..." required><br>
                    <button type="submit" id="submit-form">Adicionar</button>
                </form>
            </div>
            <div id="tarefas" class="div_main">
                <div ><p>Não há tarefas no momento.</p></div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
